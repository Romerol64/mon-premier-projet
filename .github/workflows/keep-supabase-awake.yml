name: Garder Supabase actif

# Supabase (offre gratuite) met en pause tout projet resté inactif
# environ 7 jours. Cette tâche appelle simplement l'API publique du
# site toutes les 3 jours pour compter comme une activité normale et
# empêcher la mise en pause automatique - aucune action manuelle requise.

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler l'API Supabase du site
        # Clé "anon public" du projet : conçue pour être visible publiquement
        # (déjà exposée côté navigateur dans js/supabase-config.js, protégée
        # par les règles RLS côté base de données) — pas un secret à cacher.
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "https://nqseoarmsoedbrwjyika.supabase.co/rest/v1/contenu_textes?select=cle&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xc2VvYXJtc29lZGJyd2p5aWthIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MDYxNDUsImV4cCI6MjEwNDI4MjE0NX0.NnTnHreDRRnWWmgU_rcyFLDfAgXU-YqW7Zbur-mfJeE"
